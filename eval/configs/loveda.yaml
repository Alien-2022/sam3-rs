base_config: ./base.yaml

dataloader:
  batch_size: 4
  num_workers: 4

dataset:
  name: loveda
  data_root: data/LoveDA
  # For official LoveDA layout (Val/{Urban,Rural}/{images_png,masks_png})
  img_dir: Exp/img
  mask_dir: Exp/mask
  # will be formatted as eval/datasets/cls_loveda.txt
  # read by the dataloader to know the class list and num_classes
  cls_file: cls_loveda.txt
  ignore_index: 255
  # by default, LoveDA masks use 0 for no-data value, and the segmentor's output like :
  # [background:0, building:1, road:2, water:3, barren:4, forest:5, agriculture:6]
  # so we first set reduce_zero_label to true to shift gt labels by -1, making segmentor output and gt aligned.
  # then map no-data 0 to ignore_index 255 in eval, so that no-data pixels are ignored in metrics calculation.
  reduce_zero_label: true
  # Optional: use workspace NAS registry instead of local data_root
  # When provided, will call workspace.scripts.get_data.get_data_path(data_key)
  data_key: null

segmentor:
  checkpoint_path: weights/sam3/sam3.pt
  # will be formatted as sam3/assets/bpe_simple_vocab_16e6.txt.gz
  bpe_path: bpe_simple_vocab_16e6.txt.gz
  # read by the model to build text prompts and map outputs.
  prompts_file: cls_loveda.txt
  # confidence threshhold used to filter 200 queries output by decoder.
  confidence_threshold: 0.0251
  # used to seperate background from foreground in final mask output.
  prob_threshold: 0.2342
  # Per-class prob thresholds (example values)
  # These thresholds override the global prob_threshold for specific classes
  # Class indices match the order in cls_loveda.txt:
  # 0: background, 1: building, 2: road, 3: water, 4: barren, 5: forest, 6: agriculture
  # prob_thresholds:
  #   1: 0.3828  # building
  #   2: 0.7673  # road
  #   3: 0.5565  # water
  #   4: 0.1364  # barren
  #   5: 0.0248  # forest
  #   6: 0.2085  # agriculture
  use_presence_score: true
  bg_idx: 0
  use_prompted_background: true
  # Optional: use workspace NAS registry for checkpoint
  # When provided, will call workspace.scripts.get_weights.get_weight_path(weight_key)
  weight_key: null

  # ========================================
  # Experimental Features (may be removed)
  # ========================================
  semantic_enhancement_mode: "false"  # Options: "false", "select_word", "avg_embedding"
  analyze_presence_score: false
  presence_score_mode: "before_fusion"

  # ========================================
  # Statistics Analysis
  # ========================================
  analyze_statistics: false  # Enable comprehensive statistics analysis
  compute_boundary_iou: false  # Enable boundary IoU computation (slower)

  # ===== MEMORY PROFILING CONFIGURATION =====
  # Enable detailed memory debugging
  debug_memory: false
  # Log file path for memory analysis (relative to project root)
  debug_log_file: "outputs/memory_debug_eval.log"
  
  # sliding window parameters
  # LoveDA images are 1024x1024, set to 0 for single image mode (no sliding window)
  # TVP-Fusion will work in single image mode when slide_crop_size=0

output:
  # save_pred_dir: outputs/preds/loveda
  metrics_json: outputs/metrics/loveda.json
