base_config: ./base.yaml

dataset:
  name: vaihingen
  data_root: data/Vaihingen
  img_dir: Exp/img
  mask_dir: Exp/mask
  cls_file: cls_vaihingen_llm_v2.txt
  ignore_index: 255
  reduce_zero_label: false
  data_key: null

segmentor:
  checkpoint_path: weights/sam3/sam3.pt
  bpe_path: bpe_simple_vocab_16e6.txt.gz
  prompts_file: cls_vaihingen_llm_v2.txt
  # === A1: 原始单词 + 固定阈值（对齐 SegEarth-OV3 cfg_vaihingen.py 默认值） ===
  confidence_threshold: 0.4   # 实例头 query 过滤（OV3 默认 0.4）
  prob_threshold: 0.1         # 融合后全局背景阈值
  # 不设置 instance_prob_thresholds / semantic_prob_thresholds
  use_instance_head: true
  use_semantic_head: true
  use_presence_score: true
  bg_idx: 0
  use_prompted_background: true
  weight_key: null

  semantic_enhancement_mode: "false"
  analyze_presence_score: false
  presence_score_mode: "before_fusion"
  analyze_statistics: false
  compute_boundary_iou: false
  debug_memory: false

  # Vaihingen 图像 ~2000x2500，用 1024/512 滑动窗口
  slide_crop_size: 1024
  slide_stride: 512

output:
  metrics_json: outputs/metrics/vaihingen_A2_extended.json
