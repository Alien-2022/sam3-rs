base_config: ./base.yaml

dataset:
  name: potsdam
  data_root: data/Potsdam
  img_dir: pre_slice/img
  mask_dir: pre_slice/mask
  cls_file: cls_potsdam.txt
  ignore_index: 255
  reduce_zero_label: false
  data_key: null

segmentor:
  checkpoint_path: weights/sam3/sam3.pt
  bpe_path: bpe_simple_vocab_16e6.txt.gz
  prompts_file: cls_potsdam.txt
  # === 基线固定阈值（A1: 原始单词 + 固定阈值） ===
  # 模拟 SegEarth-OV3 默认策略：先融合，后用全局 prob_threshold 过滤
  confidence_threshold: 0.2   # 实例头 query 过滤
  prob_threshold: 0.1         # 融合后全局背景阈值
  # 不设置 instance_prob_thresholds / semantic_prob_thresholds（保持 None）
  # 即不做融合前分头过滤
  use_instance_head: true  
  use_semantic_head: true
  use_presence_score: true
  bg_idx: 0 
  use_prompted_background: true
  weight_key: null

  analyze_presence_score: false
  presence_score_mode: "before_fusion"
  analyze_statistics: false
  compute_boundary_iou: false
  debug_memory: false
  debug_log_file: "assistant/memory_debug_eval.log"

  slide_crop_size: 2048
  slide_stride: 1024

output:
  metrics_json: outputs/metrics/potsdam_A1_baseline.json
