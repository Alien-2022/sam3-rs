base_config: ./base.yaml

dataset:
  name: uavid
  data_root: data/UAVid
  img_dir: pre_slice/img
  mask_dir: pre_slice/mask
  cls_file: cls_uavid.txt
  ignore_index: 255
  # UAVid dataset uses labels 0-7 for 8 classes:
  #   0 = background (clutter)
  #   1 = building
  #   2 = road
  #   3 = tree
  #   4 = low vegetation
  #   5 = moving car
  #   6 = static car
  #   7 = human
  # Since cls_uavid.txt includes background as first line (required by SAM3-RS),
  # GT labels already align with segmentor output (no need for reduce_zero_label).
  reduce_zero_label: false
  data_key: null

segmentor:
  checkpoint_path: weights/sam3/sam3.pt
  bpe_path: bpe_simple_vocab_16e6.txt.gz
  prompts_file: cls_uavid.txt
  # confidence threshhold used to filter 200 queries output by decoder.
  confidence_threshold: 0.3
  # used to seperate background from foreground in final mask output.
  prob_threshold: 0.3
  use_presence_score: true
  # Background index matches GT label 0
  bg_idx: 0
  # Set use_prompted_background=true because cls_uavid.txt includes "background"
  # as first line (no need to inject a zero-logit background channel)
  use_prompted_background: true
  weight_key: null

  # ========================================
  # Experimental Features (may be removed)
  # ========================================
  analyze_presence_score: false
  presence_score_mode: "after_fusion"

  # ========================================
  # Statistics Analysis
  # ========================================
  analyze_statistics: true  # Enable comprehensive statistics analysis
  compute_boundary_iou: false  # Enable boundary IoU computation (slower)

output:
  # save_pred_dir: outputs/preds/uavid
  metrics_json: outputs/metrics/uavid.json
