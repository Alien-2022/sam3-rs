base_config: ./base.yaml

dataset:
  name: vaihingen
  data_root: data/Vaihingen
  img_dir: Exp/img
  mask_dir: Exp/mask
  cls_file: cls_vaihingen.txt
  ignore_index: 255
  # Vaihingen dataset uses labels 0-5 for 6 classes:
  #   0 = background
  #   1 = impervious surface
  #   2 = building
  #   3 = low vegetation
  #   4 = tree
  #   5 = car
  # Since cls_vaihingen.txt includes background as first line,
  # GT labels already align with segmentor output (no need for reduce_zero_label).
  reduce_zero_label: false
  data_key: null

# Override base.yaml dataloader settings
# Vaihingen images may have different sizes, use batch_size=1
dataloader:
  batch_size: 1
  num_workers: 4
  pin_memory: true

segmentor:
  checkpoint_path: weights/sam3/sam3.pt
  bpe_path: bpe_simple_vocab_16e6.txt.gz
  prompts_file: cls_vaihingen.txt
  # confidence threshhold used to filter 200 queries output by decoder.
  confidence_threshold:  0.1582

  # Pre-fusion thresholds for each head (calibrated per-class)
  # Applied BEFORE dual-head fusion to preserve true distribution
  # prob_threshold: 0.1
  instance_prob_thresholds:
    1: 0.0500 
    2: 0.1592 
    3: 0.0500
    4: 0.0515    
    5: 0.0500
  semantic_prob_thresholds:
    1: 0.0518 
    2: 0.1660   
    3: 0.1152 
    4: 0.2539 
    5: 0.6680 
  use_instance_head: true
  use_presence_score: true
  use_semantic_head: true
  bg_idx: 0
  # Set use_prompted_background=true because cls_vaihingen.txt includes "background"
  # as the first line (no need to inject a zero-logit background channel)
  use_prompted_background: true
  weight_key: null

  
  # ========================================
  # Experimental Features (may be removed)
  # ========================================
  semantic_enhancement_mode: "false"  # Options: "false", "select_word", "avg_embedding"
  analyze_presence_score: false
  presence_score_mode: "before_fusion"

  # ========================================
  # Statistics Analysis
  # ========================================
  analyze_statistics: false  # Enable comprehensive statistics analysis
  compute_boundary_iou: false  # Enable boundary IoU computation (slower)

  # sliding window parameters
  # Vaihingen images are ~2000x2500, can be processed directly without sliding window
  # Use slide_crop_size: 0 for direct processing, or 2048 with stride 1024 for sliding
  slide_crop_size: 1024
  slide_stride: 512

output:
  # save_pred_dir: outputs/preds/vaihingen
  metrics_json: outputs/metrics/vaihingen.json
