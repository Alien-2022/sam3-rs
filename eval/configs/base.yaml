# Common defaults for eval configs
dataloader:
  batch_size: 2
  num_workers: 4
  # accelerate data transfer from CPU to GPU
  pin_memory: true

segmentor:
  device: cuda
  slide_crop_size: 0
  slide_stride: 512

output:
  save_pred_dir: null
  save_logits: false
  metrics_json: outputs/metrics.json
