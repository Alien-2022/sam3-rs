base_config: ./base.yaml

dataset:
  name: openearthmap
  data_root: data/OpenEarthMap
  img_dir: Exp/img
  mask_dir: Exp/mask
  cls_file: cls_openearthmap.txt
  ignore_index: 0
  # OpenEarthMap dataset uses labels 1-8 for 8 classes (0 is no-data).
  # We set reduce_zero_label=False to keep GT labels as-is:
  #   - GT mask (original): 0=no-data, 1-8=valid classes
  #   - GT mask (no reduce): 0=ignore, 1-8=valid classes
  #   - Segmentor output: 0=background, 1-8=valid classes (injected by segmentor)
  # This ensures direct alignment: GT [1-8] ↔ Pred [1-8]
  # Note: cls_openearthmap.txt does NOT include "background" because OpenEarthMap has no semantic
  # background class. The segmentor will inject a background channel automatically.
  reduce_zero_label: false
  data_key: null

dataloader:
  # OpenEarthMap images have different sizes (1000x1000, 1024x1024)
  # so we use a batch size of 1 to handle variable dimensions
  batch_size: 1

segmentor:
  checkpoint_path: weights/sam3/sam3.pt
  # will be formatted as sam3/assets/bpe_simple_vocab_16e6.txt.gz
  bpe_path: bpe_simple_vocab_16e6.txt.gz
  # read by the model to build text prompts and map outputs.
  prompts_file: cls_openearthmap.txt
  # confidence threshhold used to filter 200 queries output by decoder.
  confidence_threshold: 0.1
  # used to seperate background from foreground in final mask output.
  prob_threshold: 0.1
  use_presence_score: true
  # Since cls_openearthmap.txt does NOT include "background", use_prompted_background=false
  # The segmentor will inject a background channel and use prob_threshold to filter
  # low-confidence predictions to background (index 0).
  bg_idx: 0
  use_prompted_background: false
  weight_key: null

  # use_semantic_enhancement: true
  semantic_enhancement_mode: "avg_embedding"  # Options: "false", "select_word", "avg_embedding"
  analyze_presence_score: false
  presence_score_mode: "after_fusion"

output:
  # save_pred_dir: outputs/preds/openearthmap
  metrics_json: outputs/metrics/openearthmap.json