base_config: ./base.yaml

dataset:
  name: potsdam
  data_root: data/Potsdam
  # img_dir: Exp/img
  # mask_dir: Exp/mask
  img_dir: pre_slice/img_png
  mask_dir: pre_slice/mask
  cls_file: cls_potsdam.txt
  ignore_index: 255
  # Potsdam dataset uses labels 0-5 for 6 classes:
  #   0 = background
  #   1 = impervious surface
  #   2 = building
  #   3 = low vegetation
  #   4 = tree
  #   5 = car
  # Since cls_potsdam.txt includes background as the first line (required by SAM3-RS),
  # GT labels already align with segmentor output (no need for reduce_zero_label).
  reduce_zero_label: false
  data_key: null

segmentor:
  checkpoint_path: weights/sam3/sam3.pt
  bpe_path: bpe_simple_vocab_16e6.txt.gz
  prompts_file: cls_potsdam.txt
  # confidence threshhold used to filter 200 queries output by decoder.
  confidence_threshold:  0.1012
  # used to seperate background from foreground in final mask output.
  prob_threshold: 0.1087
  # prob_thresholds:
  #   1: 0.0420  # building
  #   2: 0.0356 # road
  #   3: 0.0747  # water
  #   5: 0.0256  # forest
  #   6: 0.0253  # agriculture
  use_semantic_head: true
  use_presence_score: true
  bg_idx: 0
  # Set use_prompted_background=true because cls_potsdam.txt includes "background"
  # as the first line (no need to inject a zero-logit background channel)
  use_prompted_background: true
  weight_key: null

  # ========================================
  # Experimental Features (may be removed)
  # ========================================
  semantic_enhancement_mode: "false"  # Options: "false", "select_word", "avg_embedding"
  analyze_presence_score: false
  presence_score_mode: "before_fusion"

  # ========================================
  # Statistics Analysis
  # ========================================
  analyze_statistics: false  # Enable comprehensive statistics analysis
  compute_boundary_iou: false  # Enable boundary IoU computation (slower)

  # ===== MEMORY PROFILING CONFIGURATION =====
  # Enable detailed memory debugging
  debug_memory: false
  # Log file path for memory analysis (relative to project root)
  debug_log_file: "assistant/memory_debug_eval.log"

  # sliding window parameters
  slide_crop_size: 2048 
  slide_stride: 1024

output:
  # save_pred_dir: outputs/preds/potsdam
  metrics_json: outputs/metrics/potsdam.json
